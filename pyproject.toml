[project]
name = "record"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariharan Manohar", email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.9.2",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.142.2",
    "langchain>=1.4.3",
    "langchain-text-splitters>=1.1.3",
    "llama-parse>=0.6.94",
    "pwdlib>=0.3.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3",
]

[tool.fastapi]
entrypoint = "src.record.main:app"

[project.scripts]
record = "record:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
