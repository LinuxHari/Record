[project]
name = "record"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hariharan Manohar", email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "aiobotocore>=3.9.2",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "docling-client>=2.142.1",
    "docling-core>=2.104.0",
    "fastapi[standard]>=0.142.2",
    "huggingface-hub>=0.25",
    "langchain>=1.4.3",
    "langchain-ollama>=1.1.0",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "tree-sitter>=0.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Docling's validators access fields marked deprecated even when they are unset.
    "ignore:^deprecated$:DeprecationWarning:docling\\.datamodel\\.service\\.options",
]

[tool.fastapi]
entrypoint = "src.record.main:app"

[project.scripts]
record = "record:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
